<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Spa de Firulais</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
}

body{
  font-family:Arial, Helvetica, sans-serif;
}

#gallery{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
}

.slide{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;

  transition:
    opacity 1.8s cubic-bezier(.4,0,.2,1);

  pointer-events:none;
}

.slide.active{
  opacity:1;
}

.slide img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  user-select:none;
  -webkit-user-drag:none;
}
</style>
</head>

<body>

<div id="gallery">

  <div class="slide active">
    <img
      src="https://oijgqsbltdkdkxasgica.supabase.co/storage/v1/object/public/firulais-tv/local.jpeg"
      alt=""
    >
  </div>

</div>

<script>

const images = [
  "https://oijgqsbltdkdkxasgica.supabase.co/storage/v1/object/public/firulais-tv/local.jpeg"
];

const gallery = document.getElementById("gallery");

let current = 0;

function createSlides(){

  gallery.innerHTML = "";

  images.forEach((url, index) => {

    const slide = document.createElement("div");

    slide.className = "slide";

    if(index === 0){
      slide.classList.add("active");
    }

    const img = document.createElement("img");

    img.src = url;
    img.alt = "";

    slide.appendChild(img);

    gallery.appendChild(slide);
  });
}

function next(){

  const slides = document.querySelectorAll(".slide");

  if(slides.length <= 1){
    return;
  }

  slides[current].classList.remove("active");

  current++;

  if(current >= slides.length){
    current = 0;
  }

  slides[current].classList.add("active");
}

createSlides();

setInterval(next, 8000);

</script>

</body>
</html>
