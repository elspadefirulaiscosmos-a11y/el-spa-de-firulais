<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Spa de Firulais</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap');

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#080808;
}

body{
  font-family:'Montserrat',sans-serif;
  color:white;
}

/* =========================
   ESCENARIO PRINCIPAL
========================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#080808;
}

/* =========================
   FOTOGRAFÍAS
========================= */

.slide{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  opacity:0;

  overflow:hidden;

  transition:
    opacity 2.2s cubic-bezier(.4,0,.2,1);

  pointer-events:none;
}

.slide.active{
  opacity:1;
}

.photo{
  position:absolute;
  inset:-4%;

  width:108%;
  height:108%;

  object-fit:cover;

  filter:saturate(1.03) contrast(1.02);

  transform:scale(1.04);

  transition:
    transform 12s cubic-bezier(.16,1,.3,1);
}

.slide.active .photo{
  transform:scale(1.11);
}

/* =========================
   CAPA CINEMATOGRÁFICA
========================= */

.vignette{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,.18) 65%,
      rgba(0,0,0,.65) 100%
    );

  pointer-events:none;
}

.bottomFade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  height:38%;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.72),
      rgba(0,0,0,.18),
      transparent
    );

  pointer-events:none;
}

/* =========================
   MARCA
========================= */

.brand{
  position:absolute;

  left:6vw;
  bottom:7vh;

  z-index:20;

  opacity:0;
  transform:translateY(25px);

  transition:
    opacity 1.4s ease .6s,
    transform 1.4s cubic-bezier(.16,1,.3,1) .6s;
}

.slide.active .brand{
  opacity:1;
  transform:translateY(0);
}

.brandName{
  font-family:'Playfair Display',serif;

  font-size:clamp(38px,5vw,78px);

  font-weight:500;

  letter-spacing:.02em;

  line-height:1;
}

.brandLine{
  width:0;
  height:2px;

  margin-top:18px;

  background:rgba(255,255,255,.9);

  transition:
    width 1.4s cubic-bezier(.16,1,.3,1) 1s;
}

.slide.active .brandLine{
  width:95px;
}

.brandSub{
  margin-top:12px;

  font-size:clamp(11px,1.1vw,17px);

  font-weight:400;

  letter-spacing:.38em;

  text-transform:uppercase;

  opacity:.82;
}

/* =========================
   DESTELLO DE LUZ
========================= */

.light{
  position:absolute;

  width:45vw;
  height:45vw;

  top:-25vw;
  right:-10vw;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.12),
      transparent 68%
    );

  filter:blur(10px);

  opacity:0;

  transform:translate(15vw,8vw);

  transition:
    opacity 2s ease,
    transform 10s cubic-bezier(.16,1,.3,1);
}

.slide.active .light{
  opacity:1;
  transform:translate(-10vw,20vw);
}

/* =========================
   INTRO DE MARCA
========================= */

#intro{
  position:absolute;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#090909;

  opacity:1;

  transition:
    opacity 1.8s ease;
}

#intro.hidden{
  opacity:0;
  pointer-events:none;
}

.introContent{
  text-align:center;

  transform:translateY(15px);

  animation:introEnter 2s cubic-bezier(.16,1,.3,1) forwards;
}

.introSmall{
  font-size:13px;

  letter-spacing:.55em;

  text-transform:uppercase;

  opacity:.6;

  margin-bottom:25px;
}

.introName{
  font-family:'Playfair Display',serif;

  font-size:clamp(50px,7vw,110px);

  font-weight:500;

  letter-spacing:.02em;
}

.introLine{
  width:0;
  height:1px;

  margin:28px auto 0;

  background:white;

  animation:
    introLine 1.5s cubic-bezier(.16,1,.3,1) 1s forwards;
}

@keyframes introEnter{
  from{
    opacity:0;
    transform:translateY(35px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes introLine{
  to{
    width:120px;
  }
}

/* =========================
   INDICADOR DISCRETO
========================= */

.progress{
  position:absolute;

  right:5vw;
  bottom:7vh;

  z-index:30;

  display:flex;
  gap:8px;

  opacity:.7;
}

.dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:white;

  opacity:.35;

  transition:
    opacity .5s ease,
    transform .5s ease;
}

.dot.active{
  opacity:1;
  transform:scale(1.5);
}

/* =========================
   MODO MOVIMIENTO
========================= */

@media (prefers-reduced-motion: reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }

}
</style>
</head>

<body>

<div id="stage">

  <!-- INTRO DE MARCA -->

  <div id="intro">

    <div class="introContent">

      <div class="introSmall">
        Belleza · Cuidado · Consentimiento
      </div>

      <div class="introName">
        El Spa de Firulais
      </div>

      <div class="introLine"></div>

    </div>

  </div>


  <!-- GALERÍA -->

  <div id="gallery"></div>


  <!-- INDICADORES -->

  <div class="progress" id="progress"></div>

</div>


<script>

/* =========================================
   FOTOGRAFÍAS
========================================= */

const images = [

  "https://oijgqsbltdkdkxasgica.supabase.co/storage/v1/object/public/firulais-tv/local.jpeg"

];


/* =========================================
   CONFIGURACIÓN
========================================= */

const DISPLAY_TIME = 9000;

const TRANSITION_TIME = 2200;


/* =========================================
   ELEMENTOS
========================================= */

const gallery =
  document.getElementById("gallery");

const progress =
  document.getElementById("progress");

const intro =
  document.getElementById("intro");


let current = 0;

let slides = [];


/* =========================================
   CREAR GALERÍA
========================================= */

function buildGallery(){

  gallery.innerHTML = "";

  progress.innerHTML = "";

  images.forEach((url,index)=>{

    const slide =
      document.createElement("div");

    slide.className = "slide";

    if(index === 0){
      slide.classList.add("active");
    }


    const img =
      document.createElement("img");

    img.className = "photo";

    img.src = url;

    img.alt = "";


    const vignette =
      document.createElement("div");

    vignette.className = "vignette";


    const bottomFade =
      document.createElement("div");

    bottomFade.className = "bottomFade";


    const light =
      document.createElement("div");

    light.className = "light";


    const brand =
      document.createElement("div");

    brand.className = "brand";

    brand.innerHTML = `
      <div class="brandName">
        El Spa de Firulais
      </div>

      <div class="brandLine"></div>

      <div class="brandSub">
        Belleza · Cuidado · Consentimiento
      </div>
    `;


    slide.appendChild(img);

    slide.appendChild(light);

    slide.appendChild(vignette);

    slide.appendChild(bottomFade);

    slide.appendChild(brand);


    gallery.appendChild(slide);


    const dot =
      document.createElement("div");

    dot.className = "dot";

    if(index === 0){
      dot.classList.add("active");
    }

    progress.appendChild(dot);

  });


  slides =
    document.querySelectorAll(".slide");
}


/* =========================================
   CAMBIAR FOTOGRAFÍA
========================================= */

function nextSlide(){

  if(slides.length <= 1){
    return;
  }


  slides[current]
    .classList
    .remove("active");


  const dots =
    document.querySelectorAll(".dot");

  dots[current]
    .classList
    .remove("active");


  current++;


  if(current >= slides.length){
    current = 0;
  }


  slides[current]
    .classList
    .add("active");


  dots[current]
    .classList
    .add("active");

}


/* =========================================
   INICIALIZACIÓN
========================================= */

buildGallery();


/* =========================================
   INTRO → GALERÍA
========================================= */

setTimeout(()=>{

  intro.classList.add("hidden");

},5000);


/* =========================================
   CICLO DE FOTOGRAFÍAS
========================================= */

setInterval(
  nextSlide,
  DISPLAY_TIME
);

</script>

</body>
</html>
