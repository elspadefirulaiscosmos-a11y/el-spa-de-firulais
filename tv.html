<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Spa de Firulais</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

:root{
  --ivory:#f5f1e9;
  --soft:#ddd6c9;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
}

body{
  color:var(--ivory);
  font-family:'DM Sans',sans-serif;
}

/* =====================================================
   ESCENARIO
===================================================== */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#080808;
}


/* =====================================================
   GALERÍA
===================================================== */

#gallery{
  position:absolute;
  inset:0;
}


/* =====================================================
   SLIDES
===================================================== */

.slide{
  position:absolute;
  inset:0;

  opacity:0;
  visibility:hidden;

  overflow:hidden;

  transition:
    opacity 2.2s cubic-bezier(.22,.61,.36,1),
    visibility 0s linear 2.2s;
}

.slide.active{
  opacity:1;
  visibility:visible;

  transition:
    opacity 2.2s cubic-bezier(.22,.61,.36,1),
    visibility 0s linear 0s;
}


/* =====================================================
   FONDO DE LA FOTOGRAFÍA
===================================================== */

.photoBackground{
  position:absolute;
  inset:-10%;

  width:120%;
  height:120%;

  object-fit:cover;

  filter:
    blur(42px)
    brightness(.38)
    saturate(.85);

  transform:scale(1.12);

  opacity:.9;

  transition:
    transform 14s cubic-bezier(.16,1,.3,1);
}

.slide.active .photoBackground{
  transform:scale(1.20);
}


/* =====================================================
   FOTOGRAFÍA PRINCIPAL
===================================================== */

.photoFrame{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.photo{
  width:100%;
  height:100%;

  object-fit:contain;

  transform:scale(1.015);

  filter:
    contrast(1.02)
    saturate(.98);

  transition:
    transform 13s cubic-bezier(.16,1,.3,1);
}

.slide.active .photo{
  transform:scale(1.055);
}


/* =====================================================
   CAPAS CINEMATOGRÁFICAS
===================================================== */

.darkOverlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.20),
      transparent 45%,
      rgba(0,0,0,.18)
    ),
    linear-gradient(
      0deg,
      rgba(0,0,0,.62),
      transparent 42%
    );

  pointer-events:none;
}

.vignette{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 48%,
      rgba(0,0,0,.38) 100%
    );

  pointer-events:none;
}


/* =====================================================
   DESTELLO EDITORIAL
===================================================== */

.glow{
  position:absolute;

  width:60vw;
  height:60vw;

  top:-40vw;
  right:-15vw;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.10),
      transparent 65%
    );

  filter:blur(20px);

  opacity:0;

  transform:translate(10vw,10vw);

  transition:
    opacity 3s ease,
    transform 13s cubic-bezier(.16,1,.3,1);
}

.slide.active .glow{
  opacity:.8;

  transform:
    translate(-8vw,25vw);
}


/* =====================================================
   MARCA
===================================================== */

.brand{
  position:absolute;

  top:6vh;
  left:6vw;

  z-index:20;

  opacity:0;

  transform:translateY(-14px);

  transition:
    opacity 1.2s ease .7s,
    transform 1.2s cubic-bezier(.16,1,.3,1) .7s;
}

.slide.active .brand{
  opacity:1;
  transform:translateY(0);
}

.brandName{
  font-family:'Playfair Display',serif;

  font-size:
    clamp(19px,2vw,31px);

  letter-spacing:.045em;

  font-weight:400;

  white-space:nowrap;
}

.brandSmall{
  margin-top:7px;

  font-size:
    clamp(7px,.65vw,10px);

  letter-spacing:.42em;

  text-transform:uppercase;

  opacity:.60;
}


/* =====================================================
   NÚMERO EDITORIAL
===================================================== */

.number{
  position:absolute;

  top:6vh;
  right:6vw;

  z-index:20;

  font-size:
    clamp(9px,.75vw,12px);

  letter-spacing:.28em;

  opacity:.58;

  font-weight:300;

  transition:
    opacity 1s ease .8s;
}


/* =====================================================
   MENSAJE
===================================================== */

.message{
  position:absolute;

  left:6vw;
  bottom:8vh;

  z-index:20;

  max-width:
    min(780px,68vw);

  opacity:0;

  transform:translateY(28px);

  transition:
    opacity 1.2s ease 1.1s,
    transform 1.2s cubic-bezier(.16,1,.3,1) 1.1s;
}

.slide.active .message{
  opacity:1;
  transform:translateY(0);
}

.line{
  width:0;

  height:1px;

  background:
    rgba(245,241,233,.85);

  margin-bottom:20px;

  transition:
    width 1.2s cubic-bezier(.16,1,.3,1) 1.25s;
}

.slide.active .line{
  width:75px;
}

.phrase{
  font-family:'Playfair Display',serif;

  font-size:
    clamp(25px,3.2vw,54px);

  line-height:1.15;

  font-weight:400;

  letter-spacing:-.01em;

  text-shadow:
    0 3px 25px rgba(0,0,0,.42);
}

.signature{
  margin-top:18px;

  font-size:
    clamp(8px,.7vw,11px);

  letter-spacing:.38em;

  text-transform:uppercase;

  opacity:.60;
}


/* =====================================================
   ESTILO ALTERNATIVO PARA ALGUNAS FOTOS
===================================================== */

.slide.centerText .message{
  left:50%;
  bottom:9vh;

  transform:
    translate(-50%,28px);

  text-align:center;

  max-width:75vw;
}

.slide.centerText.active .message{
  transform:
    translate(-50%,0);
}

.slide.centerText .line{
  margin-left:auto;
  margin-right:auto;
}


/* =====================================================
   TRANSICIÓN LATERAL
===================================================== */

.slide.fromRight .photo{
  transform:
    translate(2.5%,0)
    scale(1.025);
}

.slide.fromRight.active .photo{
  transform:
    translate(-50%,-50%)
    scale(1.055);
}


/* =====================================================
   INTRO
===================================================== */

#intro{
  position:absolute;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#080808;

  transition:
    opacity 2s ease;
}

#intro.hidden{
  opacity:0;
  pointer-events:none;
}

.intro{
  text-align:center;

  animation:
    introIn 2s cubic-bezier(.16,1,.3,1) forwards;
}

.introOverline{
  font-size:
    clamp(8px,.7vw,11px);

  letter-spacing:.55em;

  text-transform:uppercase;

  opacity:.50;

  margin-bottom:25px;
}

.introTitle{
  font-family:'Playfair Display',serif;

  font-size:
    clamp(55px,7vw,115px);

  font-weight:400;

  letter-spacing:.015em;
}

.introRule{
  width:0;
  height:1px;

  background:
    rgba(245,241,233,.8);

  margin:30px auto 0;

  animation:
    ruleIn 1.5s cubic-bezier(.16,1,.3,1) 1s forwards;
}

@keyframes introIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes ruleIn{
  to{
    width:120px;
  }
}


/* =====================================================
   CARGA
===================================================== */

#loading{
  position:absolute;
  inset:0;

  z-index:90;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#080808;

  font-size:9px;

  letter-spacing:.45em;

  text-transform:uppercase;

  opacity:.5;
}

#loading.hidden{
  display:none;
}


/* =====================================================
   CIERRE DE MARCA
===================================================== */

#endCard{
  position:absolute;
  inset:0;

  z-index:80;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#080808;

  opacity:0;
  visibility:hidden;

  transition:
    opacity 1.8s ease,
    visibility 0s linear 1.8s;
}

#endCard.visible{
  opacity:1;
  visibility:visible;

  transition:
    opacity 1.8s ease,
    visibility 0s linear 0s;
}

.endContent{
  text-align:center;

  transform:translateY(20px);

  opacity:0;

  transition:
    opacity 1.3s ease .5s,
    transform 1.3s cubic-bezier(.16,1,.3,1) .5s;
}

#endCard.visible .endContent{
  opacity:1;
  transform:translateY(0);
}

.endOverline{
  font-size:9px;

  letter-spacing:.55em;

  text-transform:uppercase;

  opacity:.45;

  margin-bottom:24px;
}

.endTitle{
  font-family:'Playfair Display',serif;

  font-size:
    clamp(48px,6vw,100px);

  font-weight:400;
}

.endRule{
  width:70px;
  height:1px;

  background:
    rgba(245,241,233,.8);

  margin:25px auto;
}

.endText{
  font-family:'Playfair Display',serif;

  font-size:
    clamp(17px,1.6vw,26px);

  opacity:.8;
}

.endSmall{
  margin-top:22px;

  font-size:9px;

  letter-spacing:.42em;

  text-transform:uppercase;

  opacity:.45;
}


/* =====================================================
   ERROR
===================================================== */

#error{
  position:absolute;
  inset:0;

  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  text-align:center;

  background:#080808;
}

#error.visible{
  display:flex;
}

.errorTitle{
  font-family:'Playfair Display',serif;

  font-size:50px;
}

.errorText{
  margin-top:18px;

  font-size:13px;

  opacity:.55;
}

</style>
</head>


<body>

<div id="stage">

  <div id="intro">

    <div class="intro">

      <div class="introOverline">
        Belleza · Cuidado · Experiencia
      </div>

      <div class="introTitle">
        El Spa de Firulais
      </div>

      <div class="introRule"></div>

    </div>

  </div>


  <div id="loading">
    Preparando experiencia
  </div>


  <div id="gallery"></div>


  <div id="endCard">

    <div class="endContent">

      <div class="endOverline">
        Gracias por confiar en nosotros
      </div>

      <div class="endTitle">
        El Spa de Firulais
      </div>

      <div class="endRule"></div>

      <div class="endText">
        Donde ellos son los protagonistas.
      </div>

      <div class="endSmall">
        Belleza · Cuidado · Consentimiento
      </div>

    </div>

  </div>


  <div id="error">

    <div>

      <div class="errorTitle">
        El Spa de Firulais
      </div>

      <div class="errorText">
        No fue posible cargar las fotografías.
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://oijgqsbltdkdkxasgica.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ax7YtzNJVFrLvuWcegSB0g_H3oNEBDI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const BUCKET =
  "firulais-tv";

const DISPLAY_TIME =
  9500;

const END_CARD_TIME =
  6000;


/* =====================================================
   42 FRASES
===================================================== */

const phrases = [

  "Porque ellos también merecen sentirse especiales.",

  "Un poco de cuidado. Mucho amor.",

  "La belleza está en los pequeños detalles.",

  "Consentirlos también es una forma de decir: te quiero.",

  "Cada Firulais tiene su propia esencia.",

  "Más que una estética, una experiencia.",

  "Donde el cuidado se convierte en cariño.",

  "Tu mejor amigo, en las mejores manos.",

  "Porque su bienestar también importa.",

  "Un momento de cuidado para quien siempre está contigo.",

  "Pequeños detalles. Grandes momentos.",

  "Ellos dan amor todos los días. Hoy les toca recibirlo.",

  "Cuidamos su imagen. Consentimos su corazón.",

  "Una nueva versión de su mejor momento.",

  "Que cada visita sea una experiencia especial.",

  "Belleza que se nota. Cuidado que se siente.",

  "Porque cada mascota merece su momento.",

  "Aquí comienza su momento de consentirse.",

  "El cariño también se demuestra cuidándolos.",

  "Un Firulais feliz siempre luce increíble.",

  "Detalles que hacen la diferencia.",

  "Su felicidad es nuestra mejor recompensa.",

  "Más limpio. Más bonito. Más feliz.",

  "El lugar donde consentirlos es parte del trabajo.",

  "Cada mirada cuenta una historia.",

  "Cuidar de ellos es nuestra pasión.",

  "Donde cada detalle está pensado para ellos.",

  "Porque se merecen mucho más que un baño.",

  "Un cambio de look. La misma personalidad.",

  "Su estilo también habla de ellos.",

  "Que su próximo recuerdo sea sentirse increíble.",

  "Amor, cuidado y mucho estilo.",

  "Aquí cada Firulais recibe su momento de protagonismo.",

  "La diferencia está en cómo los hacemos sentir.",

  "Más guapos. Más felices. Más Firulais.",

  "Un pequeño cambio puede hacerlos brillar.",

  "Ellos confían en nosotros. Y nosotros cuidamos de ellos.",

  "Cada visita, una nueva historia.",

  "Porque consentirlos nunca pasa de moda.",

  "Su mejor versión comienza aquí.",

  "Hecho con paciencia. Hecho con cariño.",

  "El Spa de Firulais — donde ellos son los protagonistas."

];


/* =====================================================
   ELEMENTOS
===================================================== */

const gallery =
  document.getElementById("gallery");

const loading =
  document.getElementById("loading");

const intro =
  document.getElementById("intro");

const endCard =
  document.getElementById("endCard");

const errorBox =
  document.getElementById("error");


/* =====================================================
   ESTADO
===================================================== */

let slides = [];

let current = 0;

let timer = null;

let endTimer = null;


/* =====================================================
   OBTENER FOTOS
===================================================== */

async function getImages(){

  const { data:files, error } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .list("",{

        limit:100,

        sortBy:{
          column:"created_at",
          order:"asc"
        }

      });


  if(error){

    throw error;

  }


  return (files || [])
    .filter(file=>{

      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      return [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "avif"
      ].includes(ext);

    })
    .map(file=>{

      const { data } =
        supabaseClient
          .storage
          .from(BUCKET)
          .getPublicUrl(file.name);

      return data.publicUrl;

    });

}


/* =====================================================
   CREAR SLIDE
===================================================== */

function createSlide(url,index){

  const slide =
    document.createElement("div");

  slide.className="slide";


  /*
    Cada ciertas fotografías
    cambiamos la composición
    para evitar repetición.
  */

  if(index % 5 === 2){

    slide.classList.add(
      "centerText"
    );

  }

  if(index % 7 === 4){

    slide.classList.add(
      "fromRight"
    );

  }


  if(index === 0){

    slide.classList.add(
      "active"
    );

  }


  const background =
    document.createElement("img");

  background.className=
    "photoBackground";

  background.src=url;

  background.alt="";


  const frame =
    document.createElement("div");

  frame.className=
    "photoFrame";


  const photo =
    document.createElement("img");

  photo.className="photo";

  photo.src=url;

  photo.alt="";


  frame.appendChild(photo);


  const dark =
    document.createElement("div");

  dark.className=
    "darkOverlay";


  const vignette =
    document.createElement("div");

  vignette.className=
    "vignette";


  const glow =
    document.createElement("div");

  glow.className=
    "glow";


  /*
    Marca
  */

  const brand =
    document.createElement("div");

  brand.className=
    "brand";

  brand.innerHTML=`

    <div class="brandName">
      El Spa de Firulais
    </div>

    <div class="brandSmall">
      Belleza · Cuidado · Experiencia
    </div>

  `;


  /*
    Número
  */

  const number =
    document.createElement("div");

  number.className=
    "number";

  number.textContent =
    String(index + 1)
      .padStart(2,"0");


  /*
    Mensaje
  */

  const message =
    document.createElement("div");

  message.className=
    "message";

  message.innerHTML=`

    <div class="line"></div>

    <div class="phrase">
      ${phrases[index % phrases.length]}
    </div>

    <div class="signature">
      El Spa de Firulais
    </div>

  `;


  slide.appendChild(
    background
  );

  slide.appendChild(
    frame
  );

  slide.appendChild(
    glow
  );

  slide.appendChild(
    dark
  );

  slide.appendChild(
    vignette
  );

  slide.appendChild(
    brand
  );

  slide.appendChild(
    number
  );

  slide.appendChild(
    message
  );


  return slide;

}


/* =====================================================
   CONSTRUIR GALERÍA
===================================================== */

function buildGallery(images){

  gallery.innerHTML="";


  images.forEach(
    (url,index)=>{

      gallery.appendChild(
        createSlide(
          url,
          index
        )
      );

    }
  );


  slides =
    Array.from(
      document.querySelectorAll(
        ".slide"
      )
    );


  current=0;

}


/* =====================================================
   SIGUIENTE
===================================================== */

function nextSlide(){

  if(slides.length < 2){

    return;

  }


  /*
    Última fotografía:
    mostramos cierre de marca.
  */

  if(
    current ===
    slides.length - 1
  ){

    clearInterval(timer);

    endCard.classList.add(
      "visible"
    );


    endTimer =
      setTimeout(()=>{

        endCard.classList.remove(
          "visible"
        );


        setTimeout(()=>{

          slides[current]
            .classList
            .remove("active");


          current=0;


          void slides[0]
            .offsetWidth;


          slides[0]
            .classList
            .add("active");


          timer =
            setInterval(
              nextSlide,
              DISPLAY_TIME
            );

        },1200);

      },END_CARD_TIME);


    return;

  }


  const oldSlide =
    slides[current];

  const nextIndex =
    current + 1;

  const newSlide =
    slides[nextIndex];


  /*
    Preparar nueva foto
  */

  newSlide.classList.remove(
    "active"
  );

  void newSlide.offsetWidth;


  /*
    Activar nueva foto
  */

  newSlide.classList.add(
    "active"
  );


  /*
    Retirar anterior
  */

  oldSlide.classList.remove(
    "active"
  );


  current =
    nextIndex;

}


/* =====================================================
   INICIO
===================================================== */

async function start(){

  try{

    const images =
      await getImages();


    if(!images.length){

      throw new Error(
        "No se encontraron fotografías."
      );

    }


    buildGallery(images);


    loading.classList.add(
      "hidden"
    );


    /*
      Primera fotografía visible.
      Esperamos a que la intro
      desaparezca antes de comenzar.
    */

    setTimeout(()=>{

      timer =
        setInterval(
          nextSlide,
          DISPLAY_TIME
        );

    },5000);

  }
  catch(error){

    console.error(
      "Firulais TV:",
      error
    );

    loading.classList.add(
      "hidden"
    );

    errorBox.classList.add(
      "visible"
    );

  }

}


/* =====================================================
   INTRO
===================================================== */

setTimeout(()=>{

  intro.classList.add(
    "hidden"
  );

},5000);


/* =====================================================
   ARRANCAR
===================================================== */

start();

</script>

</body>
</html>
