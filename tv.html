<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Spa de Firulais</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap');

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#080808;
}

body{
  font-family:'Montserrat',sans-serif;
  color:white;
}

/* =========================================
   ESCENARIO
========================================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#080808;
}


/* =========================================
   GALERÍA
========================================= */

#gallery{
  position:absolute;
  inset:0;
}


/* =========================================
   SLIDE
========================================= */

.slide{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  opacity:0;

  visibility:hidden;

  overflow:hidden;

  transition:
    opacity 2s cubic-bezier(.4,0,.2,1),
    visibility 0s linear 2s;

  pointer-events:none;
}

.slide.active{

  opacity:1;

  visibility:visible;

  transition:
    opacity 2s cubic-bezier(.4,0,.2,1),
    visibility 0s linear 0s;
}


/* =========================================
   FONDO
========================================= */

.background{
  position:absolute;
  inset:-10%;

  width:120%;
  height:120%;

  object-fit:cover;

  filter:
    blur(38px)
    brightness(.45)
    saturate(1.05);

  transform:scale(1.12);

  opacity:.9;

  transition:
    transform 12s cubic-bezier(.16,1,.3,1);
}

.slide.active .background{
  transform:scale(1.18);
}


/* =========================================
   FOTO PRINCIPAL
========================================= */

.photo{
  position:absolute;

  top:50%;
  left:50%;

  width:100%;
  height:100%;

  object-fit:contain;

  transform:
    translate(-50%,-50%)
    scale(1.015);

  filter:
    saturate(1.03)
    contrast(1.02);

  transition:
    transform 12s cubic-bezier(.16,1,.3,1);
}

.slide.active .photo{

  transform:
    translate(-50%,-50%)
    scale(1.055);

}


/* =========================================
   VIGNETTE
========================================= */

.vignette{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 40%,
      rgba(0,0,0,.12) 70%,
      rgba(0,0,0,.52) 100%
    );

  pointer-events:none;
}


/* =========================================
   DEGRADADO INFERIOR
========================================= */

.bottomFade{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:45%;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.78),
      rgba(0,0,0,.25),
      transparent
    );

  pointer-events:none;
}


/* =========================================
   DESTELLO
========================================= */

.light{
  position:absolute;

  width:50vw;
  height:50vw;

  top:-30vw;
  right:-15vw;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.10),
      transparent 68%
    );

  filter:blur(15px);

  opacity:0;

  transform:translate(10vw,10vw);

  transition:
    opacity 2.5s ease,
    transform 12s cubic-bezier(.16,1,.3,1);
}

.slide.active .light{

  opacity:1;

  transform:
    translate(-8vw,22vw);

}


/* =========================================
   MARCA
========================================= */

.brand{

  position:absolute;

  left:6vw;
  bottom:8vh;

  z-index:20;

  max-width:76vw;

  opacity:0;

  transform:
    translateY(28px);

  transition:
    opacity 1.1s ease .65s,
    transform 1.1s cubic-bezier(.16,1,.3,1) .65s;

}

.slide.active .brand{

  opacity:1;

  transform:
    translateY(0);

}


/* =========================================
   NOMBRE
========================================= */

.brandName{

  font-family:'Playfair Display',serif;

  font-size:
    clamp(40px,5vw,82px);

  font-weight:500;

  line-height:1;

  letter-spacing:.015em;

  text-shadow:
    0 3px 20px rgba(0,0,0,.45);

}


/* =========================================
   LÍNEA
========================================= */

.brandLine{

  width:0;

  height:2px;

  margin-top:17px;

  background:
    rgba(255,255,255,.9);

  transition:
    width 1s cubic-bezier(.16,1,.3,1) 1s;

}

.slide.active .brandLine{

  width:100px;

}


/* =========================================
   FRASE
========================================= */

.phrase{

  margin-top:18px;

  max-width:
    min(850px,72vw);

  font-family:'Playfair Display',serif;

  font-size:
    clamp(18px,2vw,32px);

  font-weight:400;

  line-height:1.35;

  letter-spacing:.01em;

  color:
    rgba(255,255,255,.94);

  text-shadow:
    0 3px 18px rgba(0,0,0,.55);

  opacity:0;

  transform:
    translateY(16px);

  transition:
    opacity 1s ease 1.25s,
    transform 1s cubic-bezier(.16,1,.3,1) 1.25s;

}

.slide.active .phrase{

  opacity:1;

  transform:
    translateY(0);

}


/* =========================================
   SUBTÍTULO
========================================= */

.subtitle{

  margin-top:12px;

  font-size:
    clamp(10px,1vw,15px);

  font-weight:400;

  letter-spacing:.42em;

  text-transform:uppercase;

  opacity:.70;

}


/* =========================================
   INDICADORES
========================================= */

.progress{

  position:absolute;

  right:5vw;
  bottom:8vh;

  z-index:50;

  display:flex;

  gap:8px;

  opacity:.6;

}

.dot{

  width:5px;
  height:5px;

  border-radius:50%;

  background:white;

  opacity:.25;

  transition:
    opacity .4s ease,
    transform .4s ease;

}

.dot.active{

  opacity:1;

  transform:scale(1.5);

}


/* =========================================
   INTRO
========================================= */

#intro{

  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#090909;

  opacity:1;

  transition:
    opacity 1.8s ease;

}

#intro.hidden{

  opacity:0;

  pointer-events:none;

}

.introContent{

  text-align:center;

  animation:
    introEnter 2s cubic-bezier(.16,1,.3,1) forwards;

}

.introSmall{

  font-size:13px;

  letter-spacing:.55em;

  text-transform:uppercase;

  opacity:.55;

  margin-bottom:25px;

}

.introName{

  font-family:'Playfair Display',serif;

  font-size:
    clamp(52px,7vw,110px);

  font-weight:500;

  letter-spacing:.02em;

}

.introLine{

  width:0;

  height:1px;

  margin:28px auto 0;

  background:white;

  animation:
    introLine 1.5s cubic-bezier(.16,1,.3,1) 1s forwards;

}

@keyframes introEnter{

  from{

    opacity:0;

    transform:
      translateY(35px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}

@keyframes introLine{

  to{

    width:120px;

  }

}


/* =========================================
   CARGANDO
========================================= */

#loading{

  position:absolute;

  inset:0;

  z-index:90;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#090909;

  font-size:13px;

  letter-spacing:.35em;

  text-transform:uppercase;

  opacity:.65;

}

#loading.hidden{

  display:none;

}


/* =========================================
   ERROR
========================================= */

#error{

  position:absolute;

  inset:0;

  z-index:200;

  display:none;

  align-items:center;

  justify-content:center;

  text-align:center;

  background:#090909;

  padding:40px;

}

#error.visible{

  display:flex;

}

.errorContent{

  max-width:700px;

}

.errorTitle{

  font-family:'Playfair Display',serif;

  font-size:48px;

  margin-bottom:20px;

}

.errorText{

  font-size:16px;

  opacity:.65;

  line-height:1.7;

}

</style>
</head>


<body>

<div id="stage">

  <div id="intro">

    <div class="introContent">

      <div class="introSmall">
        Belleza · Cuidado · Consentimiento
      </div>

      <div class="introName">
        El Spa de Firulais
      </div>

      <div class="introLine"></div>

    </div>

  </div>


  <div id="loading">
    Preparando experiencia
  </div>


  <div id="gallery"></div>


  <div
    class="progress"
    id="progress">
  </div>


  <div id="error">

    <div class="errorContent">

      <div class="errorTitle">
        El Spa de Firulais
      </div>

      <div class="errorText">
        No fue posible cargar las fotografías.
        Comprueba la conexión a Internet.
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://oijgqsbltdkdkxasgica.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ax7YtzNJVFrLvuWcegSB0g_H3oNEBDI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   CONFIGURACIÓN
========================================= */

const BUCKET =
  "firulais-tv";

const DISPLAY_TIME =
  9000;


/* =========================================
   FRASES
========================================= */

const phrases = [

  "Porque ellos también merecen sentirse especiales.",

  "Un poco de cuidado. Mucho amor.",

  "La belleza está en los pequeños detalles.",

  "Consentirlos también es una forma de decir: te quiero.",

  "Cada Firulais tiene su propia esencia.",

  "Más que una estética, una experiencia.",

  "Donde el cuidado se convierte en cariño.",

  "Tu mejor amigo, en las mejores manos.",

  "Porque su bienestar también importa.",

  "Un momento de cuidado para quien siempre está contigo.",

  "Pequeños detalles. Grandes momentos.",

  "Ellos dan amor todos los días. Hoy les toca recibirlo.",

  "Cuidamos su imagen. Consentimos su corazón.",

  "Una nueva versión de su mejor momento.",

  "Que cada visita sea una experiencia especial.",

  "Belleza que se nota. Cuidado que se siente.",

  "Porque cada mascota merece su momento.",

  "Aquí comienza su momento de consentirse.",

  "El cariño también se demuestra cuidándolos.",

  "Un Firulais feliz siempre luce increíble.",

  "Detalles que hacen la diferencia.",

  "Su felicidad es nuestra mejor recompensa.",

  "Más limpio. Más bonito. Más feliz.",

  "El lugar donde consentirlos es parte del trabajo.",

  "Cada mirada cuenta una historia.",

  "Cuidar de ellos es nuestra pasión.",

  "Donde cada detalle está pensado para ellos.",

  "Porque se merecen mucho más que un baño.",

  "Un cambio de look. La misma personalidad.",

  "Su estilo también habla de ellos.",

  "Que su próximo recuerdo sea sentirse increíble.",

  "Amor, cuidado y mucho estilo.",

  "Aquí cada Firulais recibe su momento de protagonismo.",

  "La diferencia está en cómo los hacemos sentir.",

  "Más guapos. Más felices. Más Firulais.",

  "Un pequeño cambio puede hacerlos brillar.",

  "Ellos confían en nosotros. Y nosotros cuidamos de ellos.",

  "Cada visita, una nueva historia.",

  "Porque consentirlos nunca pasa de moda.",

  "Su mejor versión comienza aquí.",

  "Hecho con paciencia. Hecho con cariño.",

  "El Spa de Firulais — donde ellos son los protagonistas."

];


/* =========================================
   ELEMENTOS
========================================= */

const gallery =
  document.getElementById("gallery");

const progress =
  document.getElementById("progress");

const loading =
  document.getElementById("loading");

const intro =
  document.getElementById("intro");

const errorBox =
  document.getElementById("error");


/* =========================================
   ESTADO
========================================= */

let slides = [];

let dots = [];

let current = 0;

let presentationTimer = null;


/* =========================================
   CARGAR FOTOS
========================================= */

async function getImages(){

  const { data: files, error } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .list("", {

        limit:100,

        sortBy:{
          column:"created_at",
          order:"asc"
        }

      });


  if(error){

    console.error(
      "Error cargando fotos:",
      error
    );

    throw error;

  }


  const imageFiles =
    (files || []).filter(file => {

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      return [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "avif"
      ].includes(extension);

    });


  return imageFiles.map(file => {

    const { data } =
      supabaseClient
        .storage
        .from(BUCKET)
        .getPublicUrl(file.name);

    return {

      name:file.name,

      url:data.publicUrl

    };

  });

}


/* =========================================
   CREAR UNA DIAPOSITIVA
========================================= */

function createSlide(item,index){

  const slide =
    document.createElement("div");

  slide.className =
    "slide";


  if(index === 0){

    slide.classList.add("active");

  }


  const background =
    document.createElement("img");

  background.className =
    "background";

  background.src =
    item.url;

  background.alt="";


  const photo =
    document.createElement("img");

  photo.className =
    "photo";

  photo.src =
    item.url;

  photo.alt="";


  const light =
    document.createElement("div");

  light.className =
    "light";


  const vignette =
    document.createElement("div");

  vignette.className =
    "vignette";


  const bottomFade =
    document.createElement("div");

  bottomFade.className =
    "bottomFade";


  const brand =
    document.createElement("div");

  brand.className =
    "brand";


  const phrase =
    phrases[
      index % phrases.length
    ];


  brand.innerHTML = `

    <div class="brandName">
      El Spa de Firulais
    </div>

    <div class="brandLine"></div>

    <div class="phrase">
      ${phrase}
    </div>

    <div class="subtitle">
      Belleza · Cuidado · Consentimiento
    </div>

  `;


  slide.appendChild(background);

  slide.appendChild(photo);

  slide.appendChild(light);

  slide.appendChild(vignette);

  slide.appendChild(bottomFade);

  slide.appendChild(brand);


  return slide;

}


/* =========================================
   CONSTRUIR PRESENTACIÓN
========================================= */

function buildPresentation(images){

  gallery.innerHTML="";

  progress.innerHTML="";


  images.forEach((item,index)=>{

    const slide =
      createSlide(item,index);

    gallery.appendChild(slide);


    const dot =
      document.createElement("div");

    dot.className="dot";


    if(index === 0){

      dot.classList.add("active");

    }


    progress.appendChild(dot);

  });


  slides =
    Array.from(
      document.querySelectorAll(".slide")
    );


  dots =
    Array.from(
      document.querySelectorAll(".dot")
    );


  current=0;

}


/* =========================================
   CAMBIO DE FOTO
========================================= */

function nextSlide(){

  if(slides.length < 2){

    return;

  }


  const oldIndex =
    current;


  const newIndex =
    (current + 1) % slides.length;


  const oldSlide =
    slides[oldIndex];

  const newSlide =
    slides[newIndex];


  /*
    Primero preparamos
    la nueva diapositiva.
  */

  newSlide.classList.remove("active");


  /*
    Forzamos al navegador
    a reconocer el estado inicial.
  */

  void newSlide.offsetWidth;


  /*
    Ahora activamos
    la nueva fotografía.
  */

  newSlide.classList.add("active");


  /*
    Quitamos la anterior
    después de activar la nueva.
  */

  oldSlide.classList.remove("active");


  /*
    Actualizamos indicadores.
  */

  if(dots[oldIndex]){

    dots[oldIndex]
      .classList
      .remove("active");

  }


  if(dots[newIndex]){

    dots[newIndex]
      .classList
      .add("active");

  }


  current =
    newIndex;

}


/* =========================================
   INICIAR
========================================= */

async function start(){

  try{

    const images =
      await getImages();


    if(!images.length){

      throw new Error(
        "No hay fotografías."
      );

    }


    buildPresentation(images);


    loading.classList.add(
      "hidden"
    );


    /*
      La presentación empieza
      únicamente después de haber
      construido todas las diapositivas.
    */

    presentationTimer =
      setInterval(
        nextSlide,
        DISPLAY_TIME
      );


  }
  catch(error){

    console.error(error);

    loading.classList.add(
      "hidden"
    );

    errorBox.classList.add(
      "visible"
    );

  }

}


/* =========================================
   INTRO
========================================= */

setTimeout(()=>{

  intro.classList.add(
    "hidden"
  );

},5000);


/* =========================================
   ARRANCAR
========================================= */

start();

</script>

</body>
</html>
