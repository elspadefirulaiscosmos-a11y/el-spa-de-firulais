<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Spa de Firulais</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap');

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#080808;
}

body{
  font-family:'Montserrat',sans-serif;
  color:white;
}

/* =========================================
   ESCENARIO
========================================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#080808;
}

/* =========================================
   SLIDE
========================================= */

.slide{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  opacity:0;

  overflow:hidden;

  transition:
    opacity 2.2s cubic-bezier(.4,0,.2,1);

  pointer-events:none;
}

.slide.active{
  opacity:1;
  .slide:not(.active) .brand{
  opacity:0;
  transform:translateY(35px);
}

.slide:not(.active) .phrase{
  opacity:0;
  transform:translateY(18px);
}

.slide:not(.active) .brandLine{
  width:0;
}
}

/* =========================================
   FONDO DESENFOCADO
   Sirve especialmente para fotos verticales
========================================= */

.background{
  position:absolute;
  inset:-8%;

  width:116%;
  height:116%;

  object-fit:cover;

  filter:
    blur(35px)
    brightness(.48)
    saturate(1.05);

  transform:scale(1.12);

  opacity:.85;
}

/* =========================================
   FOTOGRAFÍA PRINCIPAL
========================================= */

.photo{
  position:absolute;

  top:50%;
  left:50%;

  width:100%;
  height:100%;

  transform:
    translate(-50%,-50%)
    scale(1.015);

  object-fit:contain;

  filter:
    saturate(1.03)
    contrast(1.02);

  transition:
    transform 11s cubic-bezier(.16,1,.3,1);
}

.slide.active .photo{
  transform:
    translate(-50%,-50%)
    scale(1.055);
}

/* =========================================
   CAPA OSCURA CINEMATOGRÁFICA
========================================= */

.vignette{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 40%,
      rgba(0,0,0,.12) 70%,
      rgba(0,0,0,.55) 100%
    );

  pointer-events:none;
}

/* =========================================
   DEGRADADO INFERIOR
========================================= */

.bottomFade{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:45%;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.78),
      rgba(0,0,0,.25),
      transparent
    );

  pointer-events:none;
}

/* =========================================
   DESTELLO DE LUZ
========================================= */

.light{
  position:absolute;

  width:50vw;
  height:50vw;

  top:-30vw;
  right:-15vw;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.11),
      transparent 68%
    );

  filter:blur(15px);

  opacity:0;

  transform:translate(10vw,10vw);

  transition:
    opacity 2.5s ease,
    transform 11s cubic-bezier(.16,1,.3,1);
}

.slide.active .light{
  opacity:1;
  transform:translate(-8vw,22vw);
}

/* =========================================
   CONTENIDO DE MARCA
========================================= */

.brand{
  position:absolute;

  left:6vw;
  bottom:8vh;

  z-index:20;

  max-width:75vw;

  opacity:0;

  transform:translateY(35px);

  transition:
    opacity 1.4s ease .7s,
    transform 1.4s cubic-bezier(.16,1,.3,1) .7s;
}

.slide.active .brand{
  opacity:1;
  transform:translateY(0);
}

/* =========================================
   NOMBRE
========================================= */

.brandName{
  font-family:'Playfair Display',serif;

  font-size:
    clamp(40px,5vw,82px);

  font-weight:500;

  line-height:1;

  letter-spacing:.015em;

  text-shadow:
    0 3px 20px rgba(0,0,0,.45);
}

/* =========================================
   LINEA
========================================= */

.brandLine{
  width:0;
  height:2px;

  margin-top:18px;

  background:
    rgba(255,255,255,.92);

  transition:
    width 1.3s cubic-bezier(.16,1,.3,1) 1.1s;
}

.slide.active .brandLine{
  width:100px;
}

/* =========================================
   FRASE
========================================= */

.phrase{
  margin-top:18px;

  font-family:'Playfair Display',serif;

  font-size:
    clamp(18px,2vw,32px);

  font-weight:400;

  line-height:1.35;

  letter-spacing:.015em;

  max-width:
    min(850px,72vw);

  color:rgba(255,255,255,.94);

  text-shadow:
    0 3px 18px rgba(0,0,0,.55);

  opacity:0;

  transform:translateY(18px);

  transition:
    opacity 1.2s ease 1.3s,
    transform 1.2s cubic-bezier(.16,1,.3,1) 1.3s;
}

.slide.active .phrase{
  opacity:1;
  transform:translateY(0);
}

/* =========================================
   SUBTÍTULO
========================================= */

.subtitle{
  margin-top:12px;

  font-size:
    clamp(10px,1vw,15px);

  font-weight:400;

  letter-spacing:.42em;

  text-transform:uppercase;

  opacity:.72;
}

/* =========================================
   INDICADORES
========================================= */

.progress{
  position:absolute;

  right:5vw;
  bottom:8vh;

  z-index:30;

  display:flex;

  gap:8px;

  opacity:.65;
}

.dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:white;

  opacity:.25;

  transition:
    opacity .5s ease,
    transform .5s ease;
}

.dot.active{
  opacity:1;
  transform:scale(1.5);
}

/* =========================================
   INTRO
========================================= */

#intro{
  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#090909;

  opacity:1;

  transition:
    opacity 1.8s ease;
}

#intro.hidden{
  opacity:0;

  pointer-events:none;
}

.introContent{
  text-align:center;

  animation:
    introEnter 2s cubic-bezier(.16,1,.3,1) forwards;
}

.introSmall{
  font-size:13px;

  letter-spacing:.55em;

  text-transform:uppercase;

  opacity:.55;

  margin-bottom:25px;
}

.introName{
  font-family:'Playfair Display',serif;

  font-size:
    clamp(52px,7vw,110px);

  font-weight:500;

  letter-spacing:.02em;
}

.introLine{
  width:0;
  height:1px;

  margin:28px auto 0;

  background:white;

  animation:
    introLine 1.5s cubic-bezier(.16,1,.3,1) 1s forwards;
}

@keyframes introEnter{

  from{
    opacity:0;
    transform:translateY(35px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes introLine{

  to{
    width:120px;
  }

}

/* =========================================
   ESTADO DE CARGA
========================================= */

#loading{
  position:absolute;

  inset:0;

  z-index:90;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#090909;

  font-family:'Montserrat',sans-serif;

  font-size:13px;

  letter-spacing:.35em;

  text-transform:uppercase;

  opacity:.65;
}

#loading.hidden{
  display:none;
}

/* =========================================
   ERROR
========================================= */

#error{
  position:absolute;

  inset:0;

  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  text-align:center;

  background:#090909;

  padding:40px;
}

#error.visible{
  display:flex;
}

.errorContent{
  max-width:700px;
}

.errorTitle{
  font-family:'Playfair Display',serif;

  font-size:48px;

  margin-bottom:20px;
}

.errorText{
  font-size:16px;

  opacity:.65;

  line-height:1.7;
}

</style>
</head>

<body>

<div id="stage">

  <!-- INTRO -->

  <div id="intro">

    <div class="introContent">

      <div class="introSmall">
        Belleza · Cuidado · Consentimiento
      </div>

      <div class="introName">
        El Spa de Firulais
      </div>

      <div class="introLine"></div>

    </div>

  </div>


  <!-- CARGANDO -->

  <div id="loading">
    Preparando experiencia
  </div>


  <!-- GALERÍA -->

  <div id="gallery"></div>


  <!-- INDICADORES -->

  <div
    class="progress"
    id="progress">
  </div>


  <!-- ERROR -->

  <div id="error">

    <div class="errorContent">

      <div class="errorTitle">
        El Spa de Firulais
      </div>

      <div class="errorText">
        No fue posible cargar las fotografías.
        Comprueba la conexión a Internet.
      </div>

    </div>

  </div>

</div>


<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   CONFIGURACIÓN SUPABASE
========================================= */

const SUPABASE_URL =
  "https://oijgqsbltdkdkxasgica.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ax7YtzNJVFrLvuWcegSB0g_H3oNEBDI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   CONFIGURACIÓN DE PRESENTACIÓN
========================================= */

const BUCKET =
  "firulais-tv";

const DISPLAY_TIME =
  9000;


/* =========================================
   42 FRASES
========================================= */

const phrases = [

  "Porque ellos también merecen sentirse especiales.",

  "Un poco de cuidado. Mucho amor.",

  "La belleza está en los pequeños detalles.",

  "Consentirlos también es una forma de decir: te quiero.",

  "Cada Firulais tiene su propia esencia.",

  "Más que una estética, una experiencia.",

  "Donde el cuidado se convierte en cariño.",

  "Tu mejor amigo, en las mejores manos.",

  "Porque su bienestar también importa.",

  "Un momento de cuidado para quien siempre está contigo.",

  "Pequeños detalles. Grandes momentos.",

  "Ellos dan amor todos los días. Hoy les toca recibirlo.",

  "Cuidamos su imagen. Consentimos su corazón.",

  "Una nueva versión de su mejor momento.",

  "Que cada visita sea una experiencia especial.",

  "Belleza que se nota. Cuidado que se siente.",

  "Porque cada mascota merece su momento.",

  "Aquí comienza su momento de consentirse.",

  "El cariño también se demuestra cuidándolos.",

  "Un Firulais feliz siempre luce increíble.",

  "Detalles que hacen la diferencia.",

  "Su felicidad es nuestra mejor recompensa.",

  "Más limpio. Más bonito. Más feliz.",

  "El lugar donde consentirlos es parte del trabajo.",

  "Cada mirada cuenta una historia.",

  "Cuidar de ellos es nuestra pasión.",

  "Donde cada detalle está pensado para ellos.",

  "Porque se merecen mucho más que un baño.",

  "Un cambio de look. La misma personalidad.",

  "Su estilo también habla de ellos.",

  "Que su próximo recuerdo sea sentirse increíble.",

  "Amor, cuidado y mucho estilo.",

  "Aquí cada Firulais recibe su momento de protagonismo.",

  "La diferencia está en cómo los hacemos sentir.",

  "Más guapos. Más felices. Más Firulais.",

  "Un pequeño cambio puede hacerlos brillar.",

  "Ellos confían en nosotros. Y nosotros cuidamos de ellos.",

  "Cada visita, una nueva historia.",

  "Porque consentirlos nunca pasa de moda.",

  "Su mejor versión comienza aquí.",

  "Hecho con paciencia. Hecho con cariño.",

  "El Spa de Firulais — donde ellos son los protagonistas."

];


/* =========================================
   ELEMENTOS
========================================= */

const gallery =
  document.getElementById("gallery");

const progress =
  document.getElementById("progress");

const loading =
  document.getElementById("loading");

const intro =
  document.getElementById("intro");

const errorBox =
  document.getElementById("error");


let slides = [];

let current = 0;

let timer = null;


/* =========================================
   OBTENER FOTOGRAFÍAS DE SUPABASE
========================================= */

async function loadImages(){

  try{

    const { data: files, error } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .list("", {
          limit:100,
          sortBy:{
            column:"created_at",
            order:"asc"
          }
        });


    if(error){

      console.error(
        "Error cargando fotografías:",
        error
      );

      showError();

      return;

    }


    if(!files || files.length === 0){

      console.error(
        "No se encontraron fotografías."
      );

      showError();

      return;

    }


    const imageFiles =
      files.filter(file => {

        if(!file.name){
          return false;
        }

        const extension =
          file.name
            .split(".")
            .pop()
            .toLowerCase();

        return [
          "jpg",
          "jpeg",
          "png",
          "webp",
          "avif"
        ].includes(extension);

      });


    if(imageFiles.length === 0){

      showError();

      return;

    }


    const images =
      imageFiles.map(file => {

        const { data } =
          supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(file.name);

        return data.publicUrl;

      });


    buildGallery(images);

  }
  catch(error){

    console.error(error);

    showError();

  }

}


/* =========================================
   CONSTRUIR GALERÍA
========================================= */

function buildGallery(images){

  gallery.innerHTML = "";

  progress.innerHTML = "";


  images.forEach((url,index)=>{

    const slide =
      document.createElement("div");

    slide.className = "slide";

    if(index === 0){

      slide.classList.add("active");

    }


    /* Fondo */

    const background =
      document.createElement("img");

    background.className =
      "background";

    background.src = url;

    background.alt = "";


    /* Foto principal */

    const photo =
      document.createElement("img");

    photo.className =
      "photo";

    photo.src = url;

    photo.alt = "";


    /* Luz */

    const light =
      document.createElement("div");

    light.className =
      "light";


    /* Vignette */

    const vignette =
      document.createElement("div");

    vignette.className =
      "vignette";


    /* Degradado */

    const bottomFade =
      document.createElement("div");

    bottomFade.className =
      "bottomFade";


    /* Marca */

    const brand =
      document.createElement("div");

    brand.className =
      "brand";


    const phrase =
      phrases[
        index % phrases.length
      ];


    brand.innerHTML = `

      <div class="brandName">
        El Spa de Firulais
      </div>

      <div class="brandLine"></div>

      <div class="phrase">
        ${phrase}
      </div>

      <div class="subtitle">
        Belleza · Cuidado · Consentimiento
      </div>

    `;


    slide.appendChild(background);

    slide.appendChild(photo);

    slide.appendChild(light);

    slide.appendChild(vignette);

    slide.appendChild(bottomFade);

    slide.appendChild(brand);


    gallery.appendChild(slide);


    /* Indicador */

    const dot =
      document.createElement("div");

    dot.className = "dot";

    if(index === 0){

      dot.classList.add("active");

    }

    progress.appendChild(dot);

  });


  slides =
    document.querySelectorAll(".slide");


  loading.classList.add("hidden");


  startPresentation();

}


/* =========================================
   PRESENTACIÓN
========================================= */

function startPresentation(){

  if(timer){
    clearInterval(timer);
  }


  timer =
    setInterval(
      nextSlide,
      DISPLAY_TIME
    );

}


/* =========================================
   SIGUIENTE FOTO
========================================= */

function nextSlide(){

  if(slides.length <= 1){
    return;
  }

  const previous =
    slides[current];

  const dots =
    document.querySelectorAll(".dot");

  previous.classList.remove("active");

  if(dots[current]){
    dots[current].classList.remove("active");
  }

  current++;

  if(current >= slides.length){
    current = 0;
  }

  const next =
    slides[current];

  /*
    Reiniciamos completamente
    la animación de la nueva diapositiva.
  */

  next.classList.remove("active");

  void next.offsetWidth;

  next.classList.add("active");

  if(dots[current]){
    dots[current].classList.add("active");
  }

}

/* =========================================
   ERROR
========================================= */

function showError(){

  loading.classList.add("hidden");

  errorBox.classList.add("visible");

}


/* =========================================
   INICIAR
========================================= */

loadImages();


/* =========================================
   INTRO
========================================= */

setTimeout(()=>{

  intro.classList.add("hidden");

},5000);


/* =========================================
   RECARGAR GALERÍA PERIÓDICAMENTE
   Si agregas una foto nueva, la TV podrá
   detectarla automáticamente.
========================================= */

setInterval(()=>{

  loadImages();

},60000);

</script>

</body>
</html>
