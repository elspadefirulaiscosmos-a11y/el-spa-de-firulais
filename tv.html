<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Spa de Firulais</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&family=Playfair+Display:wght@400;500&display=swap');

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
}

body{
  font-family:'DM Sans',sans-serif;
  color:#f4f0e8;
}


/* =====================================================
   ESCENARIO
===================================================== */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#080808;
}


/* =====================================================
   GALERÍA
===================================================== */

#gallery{
  position:absolute;
  inset:0;
}


/* =====================================================
   DIAPOSITIVA
===================================================== */

.slide{
  position:absolute;
  inset:0;

  opacity:0;
  visibility:hidden;

  transition:
    opacity 2.4s ease,
    visibility 0s linear 2.4s;
}

.slide.active{

  opacity:1;
  visibility:visible;

  transition:
    opacity 2.4s ease,
    visibility 0s linear 0s;
}


/* =====================================================
   FONDO PARA FOTOS VERTICALES
===================================================== */

.background{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  filter:
    blur(35px)
    brightness(.38)
    saturate(.8);

  transform:scale(1.08);

  opacity:.95;
}


/* =====================================================
   FOTO PRINCIPAL
   IMPORTANTE:
   NO HAY ZOOM
   NO HAY MOVIMIENTO
===================================================== */

.photo{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  transform:none;

  filter:
    saturate(.98)
    contrast(1.02);

  opacity:1;
}


/* =====================================================
   OSCURECIMIENTO MUY SUTIL
===================================================== */

.overlay{

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.12),
      transparent 40%,
      rgba(0,0,0,.42)
    );

  pointer-events:none;
}


/* =====================================================
   MARCA
===================================================== */

.brand{

  position:absolute;

  top:6vh;
  left:5vw;

  z-index:10;

  opacity:0;

  transition:
    opacity 1.2s ease 1s;
}

.slide.active .brand{

  opacity:1;

}


.brandName{

  font-family:
    'Playfair Display',serif;

  font-size:
    clamp(20px,2vw,30px);

  font-weight:400;

  letter-spacing:.035em;

  white-space:nowrap;

  text-shadow:
    0 2px 15px rgba(0,0,0,.35);
}


.brandSub{

  margin-top:7px;

  font-size:
    clamp(7px,.65vw,10px);

  letter-spacing:.42em;

  text-transform:uppercase;

  opacity:.62;
}


/* =====================================================
   TEXTO
===================================================== */

.content{

  position:absolute;

  left:5vw;
  bottom:7vh;

  z-index:10;

  max-width:
    min(700px,70vw);

  opacity:0;

  transition:
    opacity 1.4s ease 1.5s;
}

.slide.active .content{

  opacity:1;

}


.phrase{

  font-family:
    'Playfair Display',serif;

  font-size:
    clamp(24px,2.8vw,48px);

  line-height:1.18;

  font-weight:400;

  text-shadow:
    0 3px 20px rgba(0,0,0,.48);
}


.rule{

  width:55px;

  height:1px;

  margin-top:18px;

  background:
    rgba(244,240,232,.75);
}


.signature{

  margin-top:13px;

  font-size:
    clamp(7px,.65vw,10px);

  letter-spacing:.35em;

  text-transform:uppercase;

  opacity:.58;
}


/* =====================================================
   INTRO
===================================================== */

#intro{

  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  justify-content:center;

  align-items:center;

  background:#080808;

  opacity:1;

  transition:
    opacity 2s ease;
}

#intro.hidden{

  opacity:0;

  pointer-events:none;
}

.introContent{

  text-align:center;

  opacity:0;

  animation:
    introAppear 2s ease forwards;
}

.introSmall{

  font-size:
    clamp(7px,.7vw,10px);

  letter-spacing:.5em;

  text-transform:uppercase;

  opacity:.5;

  margin-bottom:24px;
}

.introTitle{

  font-family:
    'Playfair Display',serif;

  font-size:
    clamp(52px,6vw,100px);

  font-weight:400;

  letter-spacing:.015em;
}

.introLine{

  width:80px;

  height:1px;

  margin:27px auto 0;

  background:
    rgba(244,240,232,.75);
}

@keyframes introAppear{

  from{

    opacity:0;

  }

  to{

    opacity:1;

  }

}


/* =====================================================
   CARGANDO
===================================================== */

#loading{

  position:absolute;

  inset:0;

  z-index:90;

  display:flex;

  justify-content:center;

  align-items:center;

  background:#080808;

  font-size:9px;

  letter-spacing:.4em;

  text-transform:uppercase;

  opacity:.5;
}

#loading.hidden{

  display:none;

}


/* =====================================================
   ERROR
===================================================== */

#error{

  position:absolute;

  inset:0;

  z-index:200;

  display:none;

  justify-content:center;

  align-items:center;

  text-align:center;

  background:#080808;
}

#error.visible{

  display:flex;

}

.errorTitle{

  font-family:
    'Playfair Display',serif;

  font-size:45px;
}

.errorText{

  margin-top:15px;

  font-size:12px;

  opacity:.5;
}


/* =====================================================
   CIERRE
===================================================== */

#endCard{

  position:absolute;

  inset:0;

  z-index:80;

  display:flex;

  justify-content:center;

  align-items:center;

  background:#080808;

  opacity:0;

  visibility:hidden;

  transition:
    opacity 2s ease;
}

#endCard.visible{

  opacity:1;

  visibility:visible;
}

.endContent{

  text-align:center;
}

.endSmall{

  font-size:9px;

  letter-spacing:.5em;

  text-transform:uppercase;

  opacity:.45;

  margin-bottom:25px;
}

.endTitle{

  font-family:
    'Playfair Display',serif;

  font-size:
    clamp(48px,6vw,100px);

  font-weight:400;
}

.endLine{

  width:70px;

  height:1px;

  margin:25px auto;

  background:
    rgba(244,240,232,.75);
}

.endPhrase{

  font-family:
    'Playfair Display',serif;

  font-size:
    clamp(17px,1.5vw,25px);

  opacity:.75;
}

</style>
</head>


<body>

<div id="stage">


  <!-- INTRO -->

  <div id="intro">

    <div class="introContent">

      <div class="introSmall">
        Belleza · Cuidado · Experiencia
      </div>

      <div class="introTitle">
        El Spa de Firulais
      </div>

      <div class="introLine"></div>

    </div>

  </div>


  <!-- CARGANDO -->

  <div id="loading">
    Preparando experiencia
  </div>


  <!-- GALERÍA -->

  <div id="gallery"></div>


  <!-- CIERRE -->

  <div id="endCard">

    <div class="endContent">

      <div class="endSmall">
        Gracias por confiar en nosotros
      </div>

      <div class="endTitle">
        El Spa de Firulais
      </div>

      <div class="endLine"></div>

      <div class="endPhrase">
        Donde ellos son los protagonistas.
      </div>

    </div>

  </div>


  <!-- ERROR -->

  <div id="error">

    <div>

      <div class="errorTitle">
        El Spa de Firulais
      </div>

      <div class="errorText">
        No fue posible cargar las fotografías.
      </div>

    </div>

  </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://oijgqsbltdkdkxasgica.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ax7YtzNJVFrLvuWcegSB0g_H3oNEBDI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const BUCKET =
  "firulais-tv";

const DISPLAY_TIME =
  9500;

const END_TIME =
  6000;


/* =====================================================
   FRASES
===================================================== */

const phrases = [

  "Porque ellos también merecen sentirse especiales.",

  "Un poco de cuidado. Mucho amor.",

  "La belleza está en los pequeños detalles.",

  "Consentirlos también es una forma de decir: te quiero.",

  "Cada Firulais tiene su propia esencia.",

  "Más que una estética, una experiencia.",

  "Donde el cuidado se convierte en cariño.",

  "Tu mejor amigo, en las mejores manos.",

  "Porque su bienestar también importa.",

  "Un momento de cuidado para quien siempre está contigo.",

  "Pequeños detalles. Grandes momentos.",

  "Ellos dan amor todos los días. Hoy les toca recibirlo.",

  "Cuidamos su imagen. Consentimos su corazón.",

  "Una nueva versión de su mejor momento.",

  "Que cada visita sea una experiencia especial.",

  "Belleza que se nota. Cuidado que se siente.",

  "Porque cada mascota merece su momento.",

  "Aquí comienza su momento de consentirse.",

  "El cariño también se demuestra cuidándolos.",

  "Un Firulais feliz siempre luce increíble.",

  "Detalles que hacen la diferencia.",

  "Su felicidad es nuestra mejor recompensa.",

  "Más limpio. Más bonito. Más feliz.",

  "El lugar donde consentirlos es parte del trabajo.",

  "Cada mirada cuenta una historia.",

  "Cuidar de ellos es nuestra pasión.",

  "Donde cada detalle está pensado para ellos.",

  "Porque se merecen mucho más que un baño.",

  "Un cambio de look. La misma personalidad.",

  "Su estilo también habla de ellos.",

  "Que su próximo recuerdo sea sentirse increíble.",

  "Amor, cuidado y mucho estilo.",

  "Aquí cada Firulais recibe su momento de protagonismo.",

  "La diferencia está en cómo los hacemos sentir.",

  "Más guapos. Más felices. Más Firulais.",

  "Un pequeño cambio puede hacerlos brillar.",

  "Ellos confían en nosotros. Y nosotros cuidamos de ellos.",

  "Cada visita, una nueva historia.",

  "Porque consentirlos nunca pasa de moda.",

  "Su mejor versión comienza aquí.",

  "Hecho con paciencia. Hecho con cariño.",

  "El Spa de Firulais — donde ellos son los protagonistas."

];


/* =====================================================
   ELEMENTOS
===================================================== */

const gallery =
  document.getElementById(
    "gallery"
  );

const loading =
  document.getElementById(
    "loading"
  );

const intro =
  document.getElementById(
    "intro"
  );

const endCard =
  document.getElementById(
    "endCard"
  );

const errorBox =
  document.getElementById(
    "error"
  );


/* =====================================================
   ESTADO
===================================================== */

let slides = [];

let current = 0;

let timer = null;

let endTimer = null;


/* =====================================================
   OBTENER FOTOS
===================================================== */

async function getImages(){

  const {
    data:files,
    error
  } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .list(
        "",
        {
          limit:100,

          sortBy:{
            column:"created_at",
            order:"asc"
          }
        }
      );


  if(error){

    console.error(
      error
    );

    throw error;

  }


  return (files || [])
    .filter(file=>{

      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      return [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "avif"
      ].includes(ext);

    })
    .map(file=>{

      const {
        data
      } =
        supabaseClient
          .storage
          .from(BUCKET)
          .getPublicUrl(
            file.name
          );

      return data.publicUrl;

    });

}


/* =====================================================
   CREAR FOTO
===================================================== */

function createSlide(
  url,
  index
){

  const slide =
    document.createElement(
      "div"
    );

  slide.className =
    "slide";


  if(index === 0){

    slide.classList.add(
      "active"
    );

  }


  /* Fondo */

  const background =
    document.createElement(
      "img"
    );

  background.className =
    "background";

  background.src =
    url;

  background.alt="";


  /* Foto */

  const photo =
    document.createElement(
      "img"
    );

  photo.className =
    "photo";

  photo.src =
    url;

  photo.alt="";


  /* Overlay */

  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "overlay";


  /* Marca */

  const brand =
    document.createElement(
      "div"
    );

  brand.className =
    "brand";

  brand.innerHTML = `

    <div class="brandName">
      El Spa de Firulais
    </div>

    <div class="brandSub">
      Belleza · Cuidado · Experiencia
    </div>

  `;


  /* Texto */

  const content =
    document.createElement(
      "div"
    );

  content.className =
    "content";

  content.innerHTML = `

    <div class="phrase">
      ${phrases[
        index % phrases.length
      ]}
    </div>

    <div class="rule"></div>

    <div class="signature">
      El Spa de Firulais
    </div>

  `;


  slide.appendChild(
    background
  );

  slide.appendChild(
    photo
  );

  slide.appendChild(
    overlay
  );

  slide.appendChild(
    brand
  );

  slide.appendChild(
    content
  );


  return slide;

}


/* =====================================================
   CONSTRUIR GALERÍA
===================================================== */

function buildGallery(
  images
){

  gallery.innerHTML="";


  images.forEach(
    (url,index)=>{

      gallery.appendChild(
        createSlide(
          url,
          index
        )
      );

    }
  );


  slides =
    Array.from(
      document.querySelectorAll(
        ".slide"
      )
    );


  current=0;

}


/* =====================================================
   CAMBIAR FOTO
===================================================== */

function nextSlide(){

  if(
    slides.length < 2
  ){

    return;

  }


  /*
    Si estamos en la última,
    hacemos el cierre de marca.
  */

  if(
    current ===
    slides.length - 1
  ){

    clearInterval(
      timer
    );


    endCard.classList.add(
      "visible"
    );


    endTimer =
      setTimeout(()=>{

        endCard.classList.remove(
          "visible"
        );


        setTimeout(()=>{

          slides[current]
            .classList
            .remove(
              "active"
            );


          current=0;


          /*
            Activamos la primera
            sin ningún movimiento.
          */

          slides[0]
            .classList
            .add(
              "active"
            );


          timer =
            setInterval(
              nextSlide,
              DISPLAY_TIME
            );

        },1800);

      },END_TIME);


    return;

  }


  const oldSlide =
    slides[current];

  const nextIndex =
    current + 1;

  const next =
    slides[nextIndex];


  /*
    Activamos la siguiente.
    Las dos se cruzan mediante
    un simple fade.
  */

  next.classList.add(
    "active"
  );


  /*
    Quitamos la anterior
    después de iniciar
    la transición.
  */

  oldSlide.classList.remove(
    "active"
  );


  current =
    nextIndex;

}


/* =====================================================
   INICIAR
===================================================== */

async function start(){

  try{

    const images =
      await getImages();


    if(
      !images.length
    ){

      throw new Error(
        "No hay fotografías."
      );

    }


    buildGallery(
      images
    );


    loading.classList.add(
      "hidden"
    );


    /*
      La primera foto permanece
      mientras desaparece la intro.
    */

    setTimeout(()=>{

      timer =
        setInterval(
          nextSlide,
          DISPLAY_TIME
        );

    },5000);


  }
  catch(error){

    console.error(
      "Error:",
      error
    );


    loading.classList.add(
      "hidden"
    );


    errorBox.classList.add(
      "visible"
    );

  }

}


/* =====================================================
   QUITAR INTRO
===================================================== */

setTimeout(()=>{

  intro.classList.add(
    "hidden"
  );

},5000);


/* =====================================================
   ARRANCAR
===================================================== */

start();

</script>

</body>
</html>
